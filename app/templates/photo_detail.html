{% extends "base.html" %}
{% block title %}{{ photo.name }}{% endblock %}
{% block content %}
<h1>{{ photo.name }}</h1>
<p>Uploaded: {{ photo.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
<img src="/static/uploads/{{ photo.file_name }}" alt="{{ photo.name }}" style="max-width: 100%;">
<p><a href="/">Back to dashboard</a></p>
{% if current_user %}
<form action="/photo/{{ photo.id }}/delete" method="post" onsubmit="return confirm('Delete this photo?');">
  <button type="submit">Delete</button>
</form>
{% endif %}
{% endblock %}
